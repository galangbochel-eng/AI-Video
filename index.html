<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator — Unlimited</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 720px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
        }

        .card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555;
            margin-bottom: 16px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }

        textarea, select, input[type="file"] {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus, select:focus {
            outline: none;
            border-color: #444;
        }

        textarea {
            min-height: 80px;
        }

        select {
            cursor: pointer;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: #ffffff;
            color: #0a0a0a;
        }

        .btn-primary:hover {
            background: #e0e0e0;
        }

        .btn-primary:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .status {
            font-size: 13px;
            color: #888;
            text-align: center;
            padding: 12px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status.loading {
            color: #f0a030;
        }

        .status.success {
            color: #30c060;
        }

        .status.error {
            color: #e04040;
        }

        .result {
            margin-top: 16px;
        }

        .result video {
            width: 100%;
            border-radius: 8px;
            background: #000;
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .tab.active {
            background: #1a1a1a;
            border-color: #444;
            color: #e0e0e0;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #333;
            border-top-color: #f0a030;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Video Generator</h1>
        <p class="subtitle">Unlimited generation. No tokens. No API keys.</p>

        <div class="tabs">
            <button class="tab active" data-tab="t2v">Text to Video</button>
            <button class="tab" data-tab="i2v">Image to Video</button>
        </div>

        <div class="card">
            <div class="card-title">Prompt</div>
            <div class="input-group">
                <textarea id="prompt" placeholder="Describe the video you want to generate..."></textarea>
            </div>

            <div id="imageSection" class="hidden">
                <div class="input-group">
                    <label>Upload Image (optional for T2V, required for I2V)</label>
                    <input type="file" id="imageInput" accept="image/*">
                    <img id="imagePreview" class="preview-img hidden">
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Model</label>
                    <select id="modelSelect">
                        <option value="vidu/vidu-q3">Vidu Q3 (1080p, 16s)</option>
                        <option value="vidu/vidu-q3-turbo">Vidu Q3 Turbo (Fast)</option>
                        <option value="google/veo-3.1">Veo 3.1 (Quality)</option>
                        <option value="google/veo-3.1-fast">Veo 3.1 Fast</option>
                        <option value="wan-ai/wan2.7-t2v">Wan 2.7 T2V</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Aspect Ratio</label>
                    <select id="aspectSelect">
                        <option value="16:9">16:9 Landscape</option>
                        <option value="9:16">9:16 Portrait</option>
                        <option value="1:1">1:1 Square</option>
                    </select>
                </div>
            </div>

            <button id="generateBtn" class="btn btn-primary">Generate Video</button>
        </div>

        <div id="status" class="status">Ready to generate</div>

        <div id="result" class="result"></div>
    </div>

    <script>
        // State
        let currentMode = 't2v';
        let uploadedImage = null;

        // Elements
        const promptInput = document.getElementById('prompt');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const imageSection = document.getElementById('imageSection');
        const modelSelect = document.getElementById('modelSelect');
        const aspectSelect = document.getElementById('aspectSelect');
        const generateBtn = document.getElementById('generateBtn');
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');

        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentMode = tab.dataset.tab;

                if (currentMode === 'i2v') {
                    imageSection.classList.remove('hidden');
                    modelSelect.value = 'vidu/vidu-q3'; // I2V works with Vidu
                } else {
                    imageSection.classList.add('hidden');
                }
            });
        });

        // Image preview
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    uploadedImage = ev.target.result;
                    imagePreview.src = uploadedImage;
                    imagePreview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Generate
        generateBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();

            if (!prompt) {
                updateStatus('Please enter a prompt', 'error');
                return;
            }

            if (currentMode === 'i2v' && !uploadedImage) {
                updateStatus('Please upload an image for Image-to-Video', 'error');
                return;
            }

            generateBtn.disabled = true;
            resultEl.innerHTML = '';
            updateStatus('Generating... This may take a few minutes.', 'loading');

            const startTime = Date.now();
            const timer = setInterval(() => {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(0);
                updateStatus(`Generating... ${elapsed}s elapsed`, 'loading');
            }, 1000);

            try {
                let videoElement;

                if (currentMode === 'i2v' && uploadedImage) {
                    // Image-to-Video via Puter.js
                    // Puter.js uses txt2vid with image context
                    videoElement = await puter.ai.txt2vid(prompt, {
                        model: modelSelect.value,
                        image: uploadedImage
                    });
                } else {
                    // Text-to-Video
                    videoElement = await puter.ai.txt2vid(prompt, {
                        model: modelSelect.value
                    });
                }

                clearInterval(timer);

                // Add to DOM
                videoElement.setAttribute('controls', 'true');
                videoElement.setAttribute('autoplay', 'true');
                videoElement.setAttribute('loop', 'true');
                resultEl.appendChild(videoElement);

                updateStatus('Video generated successfully!', 'success');

            } catch (error) {
                clearInterval(timer);
                console.error('Generation error:', error);
                updateStatus(`Error: ${error.message || 'Generation failed'}`, 'error');
            } finally {
                generateBtn.disabled = false;
            }
        });

        function updateStatus(message, type = '') {
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
        }
    </script>
</body>
</html>
